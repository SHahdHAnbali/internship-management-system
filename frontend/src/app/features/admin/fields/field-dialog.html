<h2 mat-dialog-title>{{ (field ? 'admin.fields.edit' : 'admin.fields.add') | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="flex min-w-[min(420px,80vw)] flex-col gap-2 pt-2!">
    <mat-form-field>
      <mat-label>{{ 'admin.fields.name' | transloco }}</mat-label>
      <input matInput formControlName="name" maxlength="100" required cdkFocusInitial />
      @if (form.controls.name.hasError('required')) {
        <mat-error>{{ 'admin.validation.required' | transloco }}</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>{{ 'admin.fields.description' | transloco }}</mat-label>
      <textarea matInput formControlName="description" maxlength="1000" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>
      {{ 'admin.actions.cancel' | transloco }}
    </button>
    <button mat-flat-button type="submit">{{ 'admin.actions.save' | transloco }}</button>
  </mat-dialog-actions>
</form>
